<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0a1615" />
<title>SummerContest — Vacation Photo Contest</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="SummerContest" />
<style>
  :root {
    --ink: #eef1ea;
    --ink-dim: rgba(238,241,234,0.62);
    --page-bg: #0a1615;
    --panel: #0f2422;
    --panel-2: #14302d;
    --paper: #fffdf7;
    --coral: #ff8a5c;
    --line: rgba(238,241,234,0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: manipulation;
  }
  #app-root {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--page-bg);
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    padding: 0 0 calc(60px + env(safe-area-inset-bottom)) 0;
    line-height: 1.45;
  }
  #app-root .headline-font {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  }

  /* ---- Header (slim — focus stays on the photos) ---- */
  .contest-header {
    background: var(--panel);
    color: var(--ink);
    padding: calc(16px + env(safe-area-inset-top)) 24px 14px;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  .contest-header::after {
    content: "";
    position: absolute;
    right: -60px; top: -60px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: var(--coral);
    opacity: 0.08;
  }
  .header-inner {
    max-width: 880px;
    margin: 0 auto;
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-text { flex: 1 1 220px; min-width: 200px; }
  .eyebrow-stamp {
    display: inline-block;
    border: 1.5px solid rgba(238,241,234,0.35);
    border-radius: 3px;
    padding: 2px 8px;
    font-size: 10px;
    letter-spacing: 0.03em;
    color: rgba(238,241,234,0.7);
    transform: rotate(-2deg);
    margin-bottom: 6px;
  }
  .contest-title { font-size: 24px; font-weight: 500; margin: 0; letter-spacing: 0.2px; color: var(--ink); line-height: 1.15; }
  .contest-sub { display: none; }
  .header-meta { display: flex; gap: 20px; flex-wrap: wrap; }
  .meta-item .meta-label { font-size: 10px; color: var(--ink-dim); margin-bottom: 1px; }
  .meta-item .meta-value { font-size: 15px; font-family: Georgia, serif; color: var(--ink); }
  .meta-value.coral { color: var(--coral); }
  @media (max-width: 640px) {
    .header-inner { flex-direction: column; align-items: flex-start; }
  }

  /* ---- User bar ---- */
  .user-bar {
    max-width: 880px; margin: 0 auto; padding: 18px 24px 0;
    display: flex; justify-content: flex-end; align-items: center; gap: 10px;
    font-size: 13.5px; color: var(--ink-dim);
  }
  .user-bar strong { color: var(--ink); }
  .user-bar button { background: none; border: none; color: var(--coral); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 0; }

  /* ---- Sections ---- */
  .section { max-width: 880px; margin: 0 auto; padding: 34px 24px 0; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; gap: 10px; }
  .section-title { font-size: 24px; margin: 0; color: var(--ink); }
  .section-note { font-size: 13px; color: var(--ink-dim); }
  .upload-btn { background: var(--coral); color: #1c1006; border: none; padding: 10px 18px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 14px; }
  .upload-btn:disabled { background: #3a4644; color: rgba(238,241,234,0.4); cursor: not-allowed; }
  .upload-hint { font-size: 12.5px; color: var(--ink-dim); margin-top: 8px; }

  /* ---- Grid & polaroid cards ---- */
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 18px; margin-top: 22px; }
  .photo-card { background: var(--paper); padding: 8px 8px 30px 8px; box-shadow: 0 3px 10px rgba(15,61,62,0.18); position: relative; cursor: pointer; transition: transform 0.15s ease; }
  .photo-card:hover { transform: translateY(-3px) rotate(0deg) !important; }
  .photo-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: #eee4cf; }
  .photo-owner-tag { position: absolute; bottom: 8px; left: 10px; font-size: 11px; color: rgba(28,43,40,0.6); }
  .delete-btn {
    position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--panel-2); color: var(--ink); border: 2px solid var(--paper); font-size: 13px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .delete-btn:hover { background: var(--coral); color: #1c1006; }
  .empty-state { margin-top: 18px; padding: 26px; border: 1px dashed var(--line); color: var(--ink-dim); font-size: 13.5px; }

  /* ---- Lightbox ---- */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(4,10,10,0.92);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  .lightbox-frame {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
    max-height: 100%;
  }
  .lightbox-topbar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }
  .lightbox-close {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lightbox-image-row {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 100%;
    min-height: 0;
  }
  .lightbox-image-row img { flex: 1 1 auto; min-width: 0; max-width: min(78vw, 560px); max-height: 56vh; display: block; object-fit: contain; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
  .lightbox-nav {
    flex: 0 0 auto;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-nav:hover { border-color: var(--coral); }
  .lightbox-bottom { margin-top: 14px; text-align: center; }
  .lightbox-caption { color: var(--ink); font-size: 14px; margin-bottom: 10px; }

  /* ---- Photo rating ---- */
  .rating-badge {
    position: absolute;
    bottom: 8px; right: 8px;
    background: rgba(10,20,20,0.72);
    color: #ffd27a;
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 5px;
  }
  .rate-widget { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
  .rate-stars {
    display: flex;
    flex-direction: row-reverse; /* markup is 5→1; this flips it back to a normal 1→5 visual order */
    gap: 4px;
  }
  .star-btn {
    background: none;
    border: none;
    font-size: 30px;
    line-height: 1;
    color: rgba(238,241,234,0.28);
    cursor: pointer;
    padding: 2px;
  }
  .star-btn.star-filled { color: #ffd27a; }
  /* Hovering a star highlights it AND every star after it in the (reversed)
     markup — i.e. every LOWER value visually — giving a live slider-style
     preview of the rating before the click confirms it. */
  .rate-stars .star-btn:hover,
  .rate-stars .star-btn:hover ~ .star-btn {
    color: #ffd27a;
  }
  .rate-summary { font-size: 12px; color: var(--ink-dim); }
  .rate-own-note { font-size: 12px; color: var(--ink-dim); font-style: italic; }

  /* ---- Name modal ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(4,10,10,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-box { background: var(--panel); padding: 32px 30px; max-width: 360px; width: 100%; max-height: 82vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.5); border: 1px solid var(--line); }
  .modal-box h2 { margin: 0 0 8px 0; font-size: 21px; color: var(--ink); }
  .modal-box p { font-size: 13.5px; color: var(--ink-dim); margin: 0 0 18px 0; }
  .modal-box input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); font-size: 14px; margin-bottom: 14px; background: var(--page-bg); color: var(--ink); font-family: inherit; }
  .modal-box button.primary { background: var(--coral); color: #1c1006; border: none; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
  .modal-error { font-size: 12.5px; color: #ff8080; margin-top: -6px; margin-bottom: 12px; }

  .user-option-list { display: flex; flex-direction: column; gap: 10px; }
  .user-option {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 12px 16px;
    background: var(--panel-2);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .user-option:hover { border-color: var(--coral); }
  .user-option-active {
    border-color: #4caf6f;
    background: rgba(76,175,111,0.14);
  }
  .user-option-check {
    color: #4caf6f;
    font-weight: 700;
    font-size: 16px;
  }

  .app-footer {
    max-width: 880px;
    margin: 34px auto 0;
    padding: 0 24px calc(20px + env(safe-area-inset-bottom));
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .notif-btn {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .notif-btn:disabled { opacity: 0.6; cursor: default; }
  .close-app-row {
    max-width: 880px;
    margin: 22px auto 0;
    padding: 0 24px;
    text-align: center;
  }
  .close-app-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .close-app-btn:hover { color: #ff8080; border-color: rgba(255,128,128,0.4); }
  .admin-link {
    background: none;
    border: none;
    color: rgba(238,241,234,0.32);
    font-size: 11.5px;
    cursor: pointer;
    padding: 6px;
  }
  .admin-link:hover { color: var(--ink-dim); }
  .admin-cancel {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 13px;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
  }
  .admin-user-list { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 4px; }
  .admin-user-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px 8px 14px;
    font-size: 14px;
    color: var(--ink);
  }
  .admin-remove-btn {
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 13px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .admin-remove-btn:hover { color: #ff8080; background: rgba(255,128,128,0.1); }
  .admin-add-form { display: flex; gap: 8px; margin-top: 12px; }
  .admin-add-form input {
    flex: 1 1 auto;
    min-width: 0;
    background: var(--page-bg);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    padding: 9px 11px;
    font-size: 16px;
    font-family: inherit;
  }
  .admin-subheading {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin: 22px 0 10px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .admin-ratings-list { display: flex; flex-direction: column; gap: 14px; }
  .admin-owner-group {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px 12px;
  }
  .admin-owner-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .admin-owner-name { font-size: 13px; font-weight: 700; color: var(--ink); }
  .admin-owner-avg { font-size: 11.5px; color: #ffd27a; font-weight: 600; }
  .admin-owner-photos { display: flex; flex-direction: column; gap: 8px; }
  .admin-rating-photo-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .admin-rating-thumb {
    width: 44px; height: 44px;
    flex: 0 0 auto;
    object-fit: cover;
    border-radius: 5px;
    background: var(--page-bg);
  }
  .admin-rating-detail { font-size: 12px; color: var(--ink-dim); line-height: 1.6; padding-top: 2px; }
  .admin-rating-detail em { font-style: italic; opacity: 0.7; }

  .toast { position: fixed; bottom: calc(22px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); padding: 10px 18px; border-radius: 4px; font-size: 13.5px; z-index: 1001; max-width: 90vw; text-align: center; }

  .confetti-canvas { position: fixed; inset: 0; z-index: 2600; pointer-events: none; }

  /* ---- Close app: sucked into the middle, TV-power-off style ---- */
  #app-root.app-closing {
    animation: appCloseEffect 0.65s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    transform-origin: center center;
  }
  @keyframes appCloseEffect {
    0%   { transform: scale(1);                    filter: brightness(1);   opacity: 1; }
    55%  { transform: scaleY(0.03) scaleX(1.04);    filter: brightness(1.6); opacity: 1; }
    78%  { transform: scaleY(0.03) scaleX(0);       filter: brightness(2);  opacity: 1; }
    100% { transform: scale(0);                     filter: brightness(0.4); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #app-root.app-closing { animation-duration: 0.05s; }
  }
  .closed-screen {
    position: fixed; inset: 0;
    z-index: 5000;
    background: #05100f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    animation: closedFadeIn 0.3s ease;
  }
  .closed-emoji { font-size: 44px; opacity: 0.85; }
  .closed-text { color: rgba(238,241,234,0.55); font-size: 14px; }
  .closed-reopen {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 22px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
  }
  @keyframes closedFadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 520px) {
    .header-meta { gap: 14px; }
  }

  /* ---- Splash screen ---- */
  #splash-screen {
    position: fixed; inset: 0;
    z-index: 3000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a1220;
    transition: opacity 0.6s ease, visibility 0.6s;
  }
  #splash-screen.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-art {
    width: min(78vw, 380px);
    aspect-ratio: 200 / 170;
    filter: drop-shadow(0 12px 30px rgba(0,0,0,0.4));
  }
  .splash-art svg { width: 100%; height: 100%; display: block; }
  .splash-title {
    margin: 22px 0 4px;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 26px;
    color: #eef1ea;
    letter-spacing: 0.3px;
  }
  .splash-tagline {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: rgba(238,241,234,0.6);
    margin-bottom: 26px;
  }
  .splash-progress-track {
    width: min(60vw, 220px);
    height: 4px;
    border-radius: 2px;
    background: rgba(238,241,234,0.15);
    overflow: hidden;
  }
  .splash-progress-fill {
    height: 100%;
    width: 0%;
    background: #ff8a5c;
    border-radius: 2px;
    animation: splashProgress 4s linear forwards;
  }
  @keyframes splashProgress { from { width: 0%; } to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    .splash-progress-fill { animation-duration: 0.01s; }
  }

  /* ---- Chat widget ---- */
  .chat-fab {
    position: relative;
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--panel-2);
    color: var(--ink);
    border: 1.5px solid var(--line);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .chat-fab-dot {
    position: absolute;
    top: -1px; right: -1px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #e5484d;
    border: 2px solid var(--panel);
  }
  .chat-panel {
    max-width: 880px;
    margin: 0 auto;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    height: min(56vh, 420px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-panel-head {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding: 10px 16px 10px 20px;
    flex: 0 0 auto;
  }
  .chat-panel-title { font-size: 14px; font-weight: 600; color: var(--ink); }
  .chat-close { background: none; border: none; color: var(--ink-dim); font-size: 16px; cursor: pointer; padding: 4px 8px; }
  .chat-messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .chat-empty { color: var(--ink-dim); font-size: 13px; text-align: center; margin-top: 20px; }
  .chat-msg { display: flex; }
  .chat-msg-self { justify-content: flex-end; }
  .chat-msg-bubble {
    max-width: 78%;
    background: var(--panel);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 13.5px;
  }
  .chat-msg-self .chat-msg-bubble { background: var(--coral); color: #1c1006; }
  .chat-msg-sender { font-size: 11px; font-weight: 600; color: var(--coral); margin-bottom: 2px; }
  .chat-msg-self .chat-msg-sender { display: none; }
  .chat-msg-text { white-space: pre-wrap; word-break: break-word; }
  .chat-msg-time { font-size: 10px; opacity: 0.6; margin-top: 3px; text-align: right; }
  .chat-compose {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    padding: 10px 20px;
    border-top: 1px solid var(--line);
  }
  .chat-compose input {
    flex: 1 1 auto;
    background: var(--page-bg);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 16px;
    font-family: inherit;
  }
  .chat-send {
    background: var(--coral);
    color: #1c1006;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  /* ---- Incoming message banner: bold, opaque, drops from the top ---- */
  .msg-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    width: 100%;
    height: 20vh;
    min-height: 128px;
    max-height: 220px;
    z-index: 2200;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel);
    border-bottom: 3px solid var(--coral);
    box-shadow: 0 12px 34px rgba(0,0,0,0.55);
    padding: calc(14px + env(safe-area-inset-top)) 22px 14px;
    cursor: pointer;
    animation: msgBannerSlideIn 0.32s cubic-bezier(0.22, 0.9, 0.32, 1.05);
  }
  .msg-banner.msg-banner-hide { animation: msgBannerSlideOut 0.24s ease forwards; }
  .msg-banner-logo { flex: 0 0 auto; width: 70px; height: 60px; }
  .msg-banner-logo svg { width: 100%; height: 100%; display: block; border-radius: 8px; }
  .msg-banner-body { flex: 1 1 auto; min-width: 0; }
  .msg-banner-from { font-size: 16px; font-weight: 700; color: var(--coral); margin-bottom: 4px; }
  .msg-banner-text {
    font-size: 19px;
    line-height: 1.3;
    color: var(--ink);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  @keyframes msgBannerSlideIn {
    from { transform: translateY(-100%); }
    to { transform: translateY(0); }
  }
  @keyframes msgBannerSlideOut {
    from { transform: translateY(0); }
    to { transform: translateY(-100%); }
  }

  /* ---- Inline compose row (send straight from the header) ---- */
  .inline-compose {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .inline-compose input {
    flex: 1 1 auto;
    min-width: 0;
    background: var(--page-bg);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 6px;
    padding: 9px 11px;
    font-size: 16px;
    font-family: inherit;
  }
  .inline-send {
    flex: 0 0 auto;
    background: var(--coral);
    color: #1c1006;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  /* ---- Presence row (online/offline dots, cosmetic only) ---- */
  .presence-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .presence-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--ink-dim);
  }
  .presence-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #6b7674;
    flex: 0 0 auto;
  }
  .presence-online .presence-dot { background: #3ecf6e; box-shadow: 0 0 0 2px rgba(62,207,110,0.18); }
  .presence-offline .presence-dot { background: #e5484d; box-shadow: 0 0 0 2px rgba(229,72,77,0.14); }
  .presence-rating { color: #ffd27a; font-weight: 600; }

  /* ---- Podium (top 3 rated entrants) ---- */
  .podium-section {
    max-width: 880px;
    margin: 0 auto;
    padding: 30px 24px 0;
  }
  .podium-title { font-size: 20px; margin: 0 0 16px; color: var(--ink); }
  .podium {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 16px;
  }
  .podium-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 108px;
  }
  .podium-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .podium-rating { font-size: 12px; color: #ffd27a; margin: 2px 0 8px; }
  .podium-bar {
    width: 100%;
    border-radius: 10px 10px 0 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 10px;
    transform-origin: bottom center;
    animation: podiumRise 0.6s cubic-bezier(0.2, 0.85, 0.3, 1.1) both;
    box-shadow: 0 -2px 0 rgba(0,0,0,0.12) inset;
  }
  .podium-medal { font-size: 24px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)); }
  .podium-bar-1 { height: 118px; background: linear-gradient(180deg, #ffe08a, #ffb84d); animation-delay: 0.18s; }
  .podium-bar-2 { height: 86px; background: linear-gradient(180deg, #eef1ea, #b9bec7); animation-delay: 0.05s; }
  .podium-bar-3 { height: 62px; background: linear-gradient(180deg, #eab98a, #c98a52); animation-delay: 0s; }
  @keyframes podiumRise {
    from { transform: scaleY(0); opacity: 0; }
    to { transform: scaleY(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .podium-bar { animation-duration: 0.01s; }
  }
  @media (max-width: 420px) {
    .podium { gap: 10px; }
    .podium-col { width: 90px; }
  }
</style>
</head>
<body>
<div id="splash-screen">
  <div class="splash-art" id="splash-art-mount"></div>
  <div class="splash-title">SummerContest</div>
  <div class="splash-tagline">Loading the gallery…</div>
  <div class="splash-progress-track"><div class="splash-progress-fill"></div></div>
</div>
<div id="app-root"></div>
<div id="msg-notify-root"></div>
<div id="closed-screen-root"></div>

<script>
(function () {
  const root = document.getElementById('app-root');
  const REG_DEADLINE = new Date('2026-09-10T23:59:59');
  const WINNER_DATE = new Date('2026-09-17T00:00:00');
  const MAX_PHOTOS = 20;
  const INDEX_KEY = 'contest:index';
  const LS_NAME_KEY = 'sunlitframes_username';
  const FALLBACK_USERS = ['Rune', 'Lander', 'Zoë', 'Jurgen']; // used only if the user list can't be fetched
  let FIXED_USERS = FALLBACK_USERS.slice(); // the real roster, loaded from the server and editable via Admin
  let galleryUserOrder = []; // randomized once per page load, so no one person's photos always land on top
  const CHAT_POLL_MS = 3000;
  const PRESENCE_HEARTBEAT_MS = 8000;
  const PRESENCE_ONLINE_MS = 20000; // considered online if heartbeat seen within this window

  let state = {
    username: null,
    index: [],
    loading: true,
    lightbox: null,
    toastMsg: null,
    showSwitcher: false,
    chatOpen: false,
    chats: {},        // threadKey -> array of {id, from, text, ts}
    lastSeen: {},      // threadKey -> timestamp of the last message the user has viewed
    chatPollHandle: null,
    chatSeenBaseline: {}, // threadKey -> id of the last message already accounted for (notified or was there at load)
    presence: {},      // name -> boolean online status (cosmetic only)
    presencePollHandle: null,
    showAdmin: false,
    adminUnlocked: false,
    adminPasswordCache: null, // kept in memory only (never persisted) once verified this session
    adminError: null,
    adminBusy: false,
    pushStatus: 'unknown', // 'unknown' | 'unsupported' | 'ios-needs-install' | 'default' | 'enabled' | 'denied'
    pushBusy: false,
    ratings: {}, // photoId -> { username: 1-5, ... }
  };

  // --- User roster: stored server-side, editable via the Admin panel ---
  async function adminCall(payload) {
    const res = await fetch('/api/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    let data;
    try { data = await res.json(); } catch (e) { data = {}; }
    if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
    return data;
  }
  async function loadUsersList() {
    try {
      const data = await adminCall({ action: 'list' });
      if (Array.isArray(data.users) && data.users.length) FIXED_USERS = data.users;
    } catch (e) {
      // keep whatever FIXED_USERS already is (fallback or previous value)
    }
  }

  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function shuffleGalleryUserOrder() {
    galleryUserOrder = shuffleArray(FIXED_USERS);
  }

  // Groups the "In competition" photos by owner, then orders those groups
  // according to this session's randomized user order (re-rolled on every
  // page load) — so the gallery reads clearly one person's photos at a
  // time, but it's never always the same person's photos sitting on top.
  function orderedOtherPhotos(photos) {
    const byOwner = {};
    photos.forEach(p => { (byOwner[p.owner] = byOwner[p.owner] || []).push(p); });
    const orderedOwners = galleryUserOrder.filter(u => byOwner[u]);
    Object.keys(byOwner).forEach(u => { if (!orderedOwners.includes(u)) orderedOwners.push(u); });
    let result = [];
    orderedOwners.forEach(u => { result = result.concat(byOwner[u]); });
    return result;
  }

  // --- Backend: our own /api/redis serverless proxy (Upstash token stays server-side) ---
  async function redisCmd(cmdArray) {
    const res = await fetch('/api/redis', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: cmdArray }),
    });
    let data;
    try { data = await res.json(); } catch (e) { data = {}; }
    if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
    if (data.error) throw new Error(data.error);
    return data.result;
  }
  async function redisGet(key) { return redisCmd(['GET', key]); }
  async function redisSet(key, value) { return redisCmd(['SET', key, value]); }
  async function redisDel(key) { return redisCmd(['DEL', key]); }

  // --- Chat: one shared group thread — everyone sends to everyone ---
  const GROUP_THREAD_KEY = 'chat:group';

  function lastSeenStorageKey() { return 'summercontest_lastseen_' + state.username; }
  function loadLastSeen() {
    try {
      const raw = localStorage.getItem(lastSeenStorageKey());
      state.lastSeen = raw ? JSON.parse(raw) : {};
    } catch (e) { state.lastSeen = {}; }
  }
  function saveLastSeen() {
    try { localStorage.setItem(lastSeenStorageKey(), JSON.stringify(state.lastSeen)); } catch (e) {}
  }
  function markThreadSeen() {
    const msgs = state.chats[GROUP_THREAD_KEY] || [];
    const last = msgs[msgs.length - 1];
    state.lastSeen[GROUP_THREAD_KEY] = last ? last.ts : Date.now();
    saveLastSeen();
  }
  function hasUnread() {
    const msgs = state.chats[GROUP_THREAD_KEY] || [];
    if (!msgs.length) return false;
    const last = msgs[msgs.length - 1];
    if (last.from === state.username) return false;
    return last.ts > (state.lastSeen[GROUP_THREAD_KEY] || 0);
  }

  async function fetchThread(threadKey) {
    try {
      const raw = await redisCmd(['LRANGE', threadKey, '-100', '-1']);
      const arr = Array.isArray(raw) ? raw : [];
      return arr.map(s => { try { return JSON.parse(s); } catch (e) { return null; } }).filter(Boolean);
    } catch (e) {
      return null; // keep whatever we had before on failure
    }
  }

  async function pollChatOnce() {
    if (!state.username) return;
    const msgs = await fetchThread(GROUP_THREAD_KEY);
    if (msgs) {
      checkForIncomingNotification(msgs);
      state.chats[GROUP_THREAD_KEY] = msgs;
    }
    updateChatDOM();
  }

  function checkForIncomingNotification(newMsgs) {
    const newLastId = newMsgs.length ? newMsgs[newMsgs.length - 1].id : null;
    const hasBaseline = Object.prototype.hasOwnProperty.call(state.chatSeenBaseline, GROUP_THREAD_KEY);
    if (!hasBaseline) {
      // first poll this session — just record where we stand, don't pop up
      // a notification for a backlog of already-existing messages (this also
      // correctly handles an empty thread, so the *next* poll can tell a
      // genuinely new message apart from "still empty").
      state.chatSeenBaseline[GROUP_THREAD_KEY] = newLastId;
      return;
    }
    if (newLastId === state.chatSeenBaseline[GROUP_THREAD_KEY]) return; // nothing new
    state.chatSeenBaseline[GROUP_THREAD_KEY] = newLastId;
    if (!newLastId) return;
    const newLast = newMsgs[newMsgs.length - 1];
    if (newLast.from === state.username) return; // our own message, already shown optimistically
    if (state.chatOpen) return; // already looking at the (only) conversation
    showIncomingNotification(newLast);
  }

  let notifyDismissTimer = null;
  function dismissIncomingNotification() {
    clearTimeout(notifyDismissTimer);
    const banner = document.getElementById('msg-banner');
    if (!banner) return;
    banner.classList.add('msg-banner-hide');
    setTimeout(() => {
      const container = document.getElementById('msg-notify-root');
      if (container) container.innerHTML = '';
    }, 260);
  }
  function showIncomingNotification(msg) {
    const container = document.getElementById('msg-notify-root');
    if (!container) return;
    clearTimeout(notifyDismissTimer);
    container.innerHTML = `
      <div class="msg-banner" id="msg-banner">
        <div class="msg-banner-logo">${beachArtSvg(false)}</div>
        <div class="msg-banner-body">
          <div class="msg-banner-from">${escapeHtml(msg.from)}</div>
          <div class="msg-banner-text">${escapeHtml(msg.text)}</div>
        </div>
      </div>
    `;
    const banner = document.getElementById('msg-banner');
    banner.onclick = () => {
      dismissIncomingNotification();
      openChatToThread();
    };
    playNotificationChime();
    notifyDismissTimer = setTimeout(dismissIncomingNotification, 3000);
  }

  // --- Notification sound: a short synthesized two-note chime (no audio
  // file needed). Browsers block audio until the page has had a user
  // gesture, so we lazily create/resume a shared AudioContext on the
  // first tap/keypress and reuse it from then on. ---
  let audioCtx = null;
  let welcomeJinglePlayed = false;
  function ensureAudioContext() {
    let justCreated = false;
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); justCreated = true; } catch (e) { return; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (justCreated && !welcomeJinglePlayed) {
      welcomeJinglePlayed = true;
      playWelcomeJingle();
    }
  }
  document.addEventListener('pointerdown', ensureAudioContext);
  document.addEventListener('keydown', ensureAudioContext);

  // Original short instrumental jingle (bright, tropical, marimba-ish) —
  // fires once per session on the first interaction, since browsers block
  // audio from autoplaying before any tap/click ever happens.
  function playWelcomeJingle() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5]; // C5 E5 G5 C6 G5 C6
    const stepTime = 0.14;
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const start = now + i * stepTime;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.16, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.32);
    });
    const chordStart = now + notes.length * stepTime + 0.02;
    [523.25, 659.25, 783.99].forEach(freq => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, chordStart);
      gain.gain.linearRampToValueAtTime(0.12, chordStart + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, chordStart + 0.9);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(chordStart);
      osc.stop(chordStart + 0.95);
    });
  }

  function playNotificationChime() {
    if (!audioCtx) return; // not unlocked yet (no user gesture so far) — skip silently
    const now = audioCtx.currentTime;
    [880, 1175].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const start = now + i * 0.13;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.2, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.24);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.26);
    });
  }

  // One short sound per star count, getting brighter/fuller as the rating
  // goes up — 5 stars gets a little extra celebratory flourish on top.
  function playRatingSound(stars) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const noteSets = {
      1: [392],
      2: [392, 440],
      3: [392, 440, 494],
      4: [392, 440, 494, 523],
      5: [392, 494, 587, 659, 784],
    };
    const notes = noteSets[stars] || noteSets[1];
    const stepTime = stars === 5 ? 0.09 : 0.11;
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = stars === 5 ? 'triangle' : 'sine';
      osc.frequency.value = freq;
      const start = now + i * stepTime;
      const peak = stars === 5 ? 0.25 : 0.18;
      const dur = stars === 5 ? 0.36 : 0.22;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(peak, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.04);
    });
    if (stars === 5) {
      const chordStart = now + notes.length * stepTime + 0.03;
      [784, 988, 1175].forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, chordStart);
        gain.gain.linearRampToValueAtTime(0.15, chordStart + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, chordStart + 0.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(chordStart);
        osc.stop(chordStart + 0.55);
      });
    }
  }

  function createNoiseBuffer(duration) {
    const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  // A descending tone swept through a filter, plus a bandpassed noise burst
  // — the classic "vacuum suck" whoosh, for the close-app animation.
  function playCloseSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const oscGain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(1100, now);
    osc.frequency.exponentialRampToValueAtTime(70, now + 0.5);
    oscGain.gain.setValueAtTime(0.0001, now);
    oscGain.gain.linearRampToValueAtTime(0.18, now + 0.06);
    oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
    osc.connect(oscGain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.58);

    const noise = audioCtx.createBufferSource();
    noise.buffer = createNoiseBuffer(0.5);
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.setValueAtTime(1800, now);
    noiseFilter.frequency.exponentialRampToValueAtTime(150, now + 0.45);
    noiseFilter.Q.value = 0.7;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, now);
    noiseGain.gain.linearRampToValueAtTime(0.15, now + 0.05);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
    noise.connect(noiseFilter).connect(noiseGain).connect(audioCtx.destination);
    noise.start(now);
    noise.stop(now + 0.5);
  }

  // --- Confetti: a lightweight canvas particle burst, cleans itself up
  // after a few seconds. No library — just a couple dozen rectangles with
  // gravity and fade-out. ---
  function launchConfetti() {
    const canvas = document.createElement('canvas');
    canvas.className = 'confetti-canvas';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    if (!ctx) { canvas.remove(); return; }
    const colors = ['#ff8a5c', '#ffd27a', '#3ecf6e', '#eef1ea', '#ff6b6b', '#6ec6ff'];
    const particles = [];
    const count = 90;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: canvas.width / 2 + (Math.random() - 0.5) * 100,
        y: canvas.height * 0.35 + (Math.random() - 0.5) * 40,
        vx: (Math.random() - 0.5) * 9,
        vy: -(Math.random() * 6 + 4),
        size: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 12,
        gravity: 0.15 + Math.random() * 0.08,
        life: 0,
        maxLife: 130 + Math.random() * 40,
      });
    }
    let frame = 0;
    function tick() {
      frame++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let aliveAny = false;
      particles.forEach(p => {
        p.life++;
        if (p.life > p.maxLife) return;
        aliveAny = true;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotSpeed;
        const alpha = Math.max(0, 1 - p.life / p.maxLife);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });
      if (aliveAny && frame < 220) {
        requestAnimationFrame(tick);
      } else {
        canvas.remove();
      }
    }
    requestAnimationFrame(tick);
  }

  // "Closing" the app: play the suck/whoosh sound, shrink the whole app
  // down to a point (TV-power-off style), then show a friendly placeholder.
  // A webpage's own script generally can't close a browser tab it didn't
  // open itself (browsers block it as a safety measure), and attempting
  // window.close() anyway turned out to risk odd teardown behavior in some
  // environments — so this relies entirely on the visual "closed" screen,
  // which is reliable everywhere and delivers the same fun result.
  function closeApp() {
    playCloseSound();
    stopChatPolling();
    stopPresenceLoop();
    if (root) root.classList.add('app-closing');
    setTimeout(showClosedScreen, 650);
  }
  function showClosedScreen() {
    const container = document.getElementById('closed-screen-root');
    if (!container) return;
    container.innerHTML = `
      <div class="closed-screen" id="closed-screen">
        <div class="closed-emoji">🏖️</div>
        <div class="closed-text">SummerContest closed</div>
        <button class="closed-reopen" id="closed-reopen">Tap to reopen</button>
      </div>
    `;
    const reopenBtn = document.getElementById('closed-reopen');
    if (reopenBtn) reopenBtn.onclick = () => location.reload();
  }

  function openChatToThread() {
    state.chatOpen = true;
    render();
    scrollChatToBottom();
    focusChatInput();
    pollChatOnce().then(scrollChatToBottom);
  }

  function stopChatPolling() {
    if (state.chatPollHandle) { clearInterval(state.chatPollHandle); state.chatPollHandle = null; }
  }
  function startChatPolling() {
    stopChatPolling();
    pollChatOnce();
    state.chatPollHandle = setInterval(pollChatOnce, CHAT_POLL_MS);
  }

  function pollNowIfActive() {
    if (state.username) { pollChatOnce(); sendPresenceHeartbeat(); fetchPresence(); }
  }
  // Mobile browsers throttle or fully pause setInterval while the tab is
  // backgrounded or the screen is locked, so a poll can silently stall for
  // much longer than CHAT_POLL_MS. Force an immediate catch-up poll the
  // moment the page becomes visible/focused again (or is restored from
  // iOS Safari's back-forward cache) so messages/notifications never feel
  // "missed".
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') pollNowIfActive();
  });
  window.addEventListener('focus', pollNowIfActive);
  window.addEventListener('pageshow', pollNowIfActive);

  // Lightbox keyboard navigation (desktop convenience) — registered once,
  // not inside attachHandlers, so it doesn't pile up duplicate listeners
  // on every re-render.
  document.addEventListener('keydown', (e) => {
    if (!state.lightbox) return;
    if (e.key === 'ArrowLeft') navigateLightbox(-1);
    else if (e.key === 'ArrowRight') navigateLightbox(1);
    else if (e.key === 'Escape') { state.lightbox = null; render(); }
  });

  // --- Presence: a lightweight heartbeat so the 3 names can show an
  // online/offline dot. This is purely cosmetic and never affects who can
  // send or receive messages. ---
  function presenceKey(name) { return 'presence:' + name; }
  async function sendPresenceHeartbeat() {
    if (!state.username) return;
    try { await redisCmd(['SET', presenceKey(state.username), String(Date.now())]); } catch (e) {}
  }
  async function fetchPresence() {
    for (const name of FIXED_USERS) {
      try {
        const raw = await redisCmd(['GET', presenceKey(name)]);
        const ts = raw ? Number(raw) : 0;
        state.presence[name] = !!ts && (Date.now() - ts) < PRESENCE_ONLINE_MS;
      } catch (e) { /* leave previous known status as-is on failure */ }
    }
    updatePresenceDOM();
  }
  function updatePresenceDOM() {
    root.querySelectorAll('[data-presence-name]').forEach(el => {
      const name = el.getAttribute('data-presence-name');
      el.classList.toggle('presence-online', !!state.presence[name]);
      el.classList.toggle('presence-offline', !state.presence[name]);
    });
  }
  function startPresenceLoop() {
    stopPresenceLoop();
    sendPresenceHeartbeat();
    fetchPresence();
    state.presencePollHandle = setInterval(() => { sendPresenceHeartbeat(); fetchPresence(); }, PRESENCE_HEARTBEAT_MS);
  }
  function stopPresenceLoop() {
    if (state.presencePollHandle) { clearInterval(state.presencePollHandle); state.presencePollHandle = null; }
  }

  // --- Push notifications ---
  // Detects what's possible on this device/browser and drives the
  // "Enable notifications" flow. iOS Safari only supports web push once
  // the site has been added to the home screen and reopened from there —
  // there's no way around that, it's an OS-level restriction.
  function isIos() {
    return /iP(hone|od|ad)/.test(navigator.userAgent || '');
  }
  function isStandalone() {
    return window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
  }
  function pushSupported() {
    return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  }
  function detectPushStatus() {
    if (!pushSupported()) {
      state.pushStatus = (isIos() && !isStandalone()) ? 'ios-needs-install' : 'unsupported';
      return;
    }
    if (Notification.permission === 'granted') {
      // still need to confirm we actually hold a live subscription, done async elsewhere
      state.pushStatus = 'checking';
    } else if (Notification.permission === 'denied') {
      state.pushStatus = 'denied';
    } else {
      state.pushStatus = 'default';
    }
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const output = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) output[i] = rawData.charCodeAt(i);
    return output;
  }

  async function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return null;
    try { return await navigator.serviceWorker.register('/sw.js'); } catch (e) { return null; }
  }

  async function refreshPushSubscriptionStatus() {
    if (!pushSupported()) return;
    if (Notification.permission !== 'granted') { detectPushStatus(); return; }
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      state.pushStatus = sub ? 'enabled' : 'default';
    } catch (e) {
      state.pushStatus = 'default';
    }
    updatePushDOM();
  }

  async function enableNotifications() {
    if (!pushSupported()) {
      if (isIos() && !isStandalone()) {
        showToast('On iPhone: tap Share, then "Add to Home Screen", then open SummerContest from your home screen to enable notifications.');
      } else {
        showToast("This browser doesn't support notifications.");
      }
      return;
    }
    state.pushBusy = true;
    render();
    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        state.pushStatus = permission === 'denied' ? 'denied' : 'default';
        state.pushBusy = false;
        render();
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      const keyRes = await fetch('/api/push-key');
      const keyData = await keyRes.json();
      if (!keyRes.ok || !keyData.publicKey) throw new Error(keyData.error || 'Push is not configured on the server yet.');
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(keyData.publicKey),
      });
      await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save', username: state.username, subscription: sub.toJSON ? sub.toJSON() : sub }),
      });
      state.pushStatus = 'enabled';
      showToast('Notifications are on for this device.');
    } catch (e) {
      showToast('Could not enable notifications: ' + e.message);
    }
    state.pushBusy = false;
    render();
  }

  function updatePushDOM() {
    const btn = document.getElementById('notif-btn');
    if (!btn) return;
    btn.textContent = pushButtonLabel();
    btn.disabled = state.pushBusy;
  }
  function pushButtonLabel() {
    if (state.pushStatus === 'enabled') return '🔔 Notifications on';
    if (state.pushStatus === 'denied') return '🔕 Notifications blocked';
    if (state.pushStatus === 'ios-needs-install') return '🔔 Enable notifications';
    if (state.pushStatus === 'unsupported') return '🔔 Enable notifications';
    return state.pushBusy ? '🔔 Enabling…' : '🔔 Enable notifications';
  }

  async function sendChatMessage(text) {
    const clean = text.trim().slice(0, 500);
    if (!clean || !state.username) return;
    const msg = {
      id: state.username + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      from: state.username,
      text: clean,
      ts: Date.now(),
    };
    if (!state.chats[GROUP_THREAD_KEY]) state.chats[GROUP_THREAD_KEY] = [];
    state.chats[GROUP_THREAD_KEY].push(msg); // optimistic local echo
    markThreadSeen();
    updateChatDOM();
    try {
      const res = await fetch('/api/send-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ from: state.username, text: clean }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
    } catch (e) {
      showToast('Message failed to send: ' + e.message);
    }
  }

  function renderChatMessages(msgs) {
    if (!msgs.length) return `<div class="chat-empty">No messages yet — say hi!</div>`;
    return msgs.map(m => {
      const self = m.from === state.username;
      const time = new Date(m.ts).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      return `
        <div class="chat-msg ${self ? 'chat-msg-self' : ''}">
          <div class="chat-msg-bubble">
            <div class="chat-msg-sender">${escapeHtml(m.from)}</div>
            <div class="chat-msg-text">${escapeHtml(m.text)}</div>
            <div class="chat-msg-time">${time}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  // Patches only the chat widget's DOM (badge / message list) without a
  // full app re-render, so a background poll never wipes out text someone
  // is mid-way through typing in the compose box.
  function updateChatDOM() {
    if (state.chatOpen) markThreadSeen();

    const fab = document.getElementById('chat-fab');
    if (fab) {
      const existingDot = fab.querySelector('.chat-fab-dot');
      const unread = hasUnread();
      if (unread && !existingDot) {
        const dot = document.createElement('span');
        dot.className = 'chat-fab-dot';
        fab.appendChild(dot);
      } else if (!unread && existingDot) {
        existingDot.remove();
      }
    }
    if (!state.chatOpen) return;

    const listEl = document.getElementById('chat-messages');
    if (listEl) {
      const wasNearBottom = listEl.scrollTop + listEl.clientHeight >= listEl.scrollHeight - 40;
      listEl.innerHTML = renderChatMessages(state.chats[GROUP_THREAD_KEY] || []);
      if (wasNearBottom) listEl.scrollTop = listEl.scrollHeight;
    }

  function registrationOpen() { return new Date() < REG_DEADLINE; }

  function showToast(msg) {
    state.toastMsg = msg;
    render();
    setTimeout(() => { state.toastMsg = null; render(); }, 3200);
  }

  function loadUsername() {
    try {
      const stored = localStorage.getItem(LS_NAME_KEY) || null;
      state.username = FIXED_USERS.includes(stored) ? stored : null;
    } catch (e) { state.username = null; }
  }
  function saveUsername(name) {
    if (!FIXED_USERS.includes(name)) return;
    state.username = name;
    state.showSwitcher = false;
    state.chatOpen = false;
    state.chats = {};
    state.chatSeenBaseline = {};
    dismissIncomingNotification();
    try { localStorage.setItem(LS_NAME_KEY, name); } catch (e) {}
    loadLastSeen();
    startChatPolling();
    startPresenceLoop();
    reassociatePushSubscriptionWithCurrentUser();
    render();
  }

  // If this browser already holds a push subscription (granted under a
  // previous named user on this same shared device), re-save it under
  // whoever's signed in now so they keep getting notifications without
  // needing to tap "Enable notifications" again.
  async function reassociatePushSubscriptionWithCurrentUser() {
    if (!pushSupported() || Notification.permission !== 'granted') return;
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (!sub) return;
      await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save', username: state.username, subscription: sub.toJSON ? sub.toJSON() : sub }),
      });
      state.pushStatus = 'enabled';
      updatePushDOM();
    } catch (e) { /* best-effort */ }
  }

  async function loadIndex() {
    try {
      const raw = await redisGet(INDEX_KEY);
      state.index = raw ? JSON.parse(raw) : [];
    } catch (e) {
      state.index = [];
      showToast('Could not load the gallery: ' + e.message);
    }
    await loadRatingsFor(state.index.map(p => p.id));
  }

  // --- Ratings: 1-5 stars per photo, stored as a Redis hash (rating:<photoId>
  // -> { username: stars }) so two people rating the same photo at the same
  // instant can't clobber each other (HSET is atomic per field). ---
  async function loadRatingsFor(photoIds) {
    await Promise.all(photoIds.map(async (id) => {
      try {
        const raw = await redisCmd(['HGETALL', 'rating:' + id]);
        state.ratings[id] = flatArrayToRatingMap(raw);
      } catch (e) { /* leave whatever we had before on failure */ }
    }));
  }
  function flatArrayToRatingMap(raw) {
    const map = {};
    if (Array.isArray(raw)) {
      for (let i = 0; i < raw.length - 1; i += 2) map[raw[i]] = Number(raw[i + 1]);
    }
    return map;
  }
  function ratingStats(photoId) {
    const map = state.ratings[photoId] || {};
    const values = Object.values(map);
    if (!values.length) return { avg: 0, count: 0 };
    return { avg: values.reduce((a, b) => a + b, 0) / values.length, count: values.length };
  }
  function myRating(photoId) {
    const map = state.ratings[photoId] || {};
    return state.username ? (map[state.username] || 0) : 0;
  }
  async function submitRating(photoId, stars) {
    if (!state.username) return;
    const photo = state.index.find(p => p.id === photoId);
    if (photo && photo.owner === state.username) return; // can't rate your own photo
    if (!state.ratings[photoId]) state.ratings[photoId] = {};
    state.ratings[photoId][state.username] = stars; // optimistic
    render();
    launchConfetti();
    playRatingSound(stars);
    try {
      await redisCmd(['HSET', 'rating:' + photoId, state.username, String(stars)]);
      if (photo) notifyRatingPush(photo.owner, stars);
    } catch (e) {
      showToast('Could not save your rating: ' + e.message);
    }
  }
  function notifyRatingPush(ownerName, stars) {
    // Best-effort, fire-and-forget — never blocks or affects the rating UX.
    fetch('/api/notify-rating', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rater: state.username, owner: ownerName, stars }),
    }).catch(() => {});
  }
  async function refreshRatingForPhoto(photoId) {
    try {
      const raw = await redisCmd(['HGETALL', 'rating:' + photoId]);
      state.ratings[photoId] = flatArrayToRatingMap(raw);
      if (state.lightbox && state.lightbox.id === photoId) render();
    } catch (e) { /* ignore, keep showing what we had */ }
  }

  // A user's overall rating pools every individual star given across all of
  // their photos (rather than averaging their photos' averages), so someone
  // with one 5-star photo doesn't outrank someone with ten well-rated ones.
  function userRatingStats(username) {
    const photoIds = state.index.filter(p => p.owner === username).map(p => p.id);
    let allValues = [];
    photoIds.forEach(id => {
      const map = state.ratings[id] || {};
      allValues = allValues.concat(Object.values(map));
    });
    if (!allValues.length) return { avg: 0, count: 0 };
    return { avg: allValues.reduce((a, b) => a + b, 0) / allValues.length, count: allValues.length };
  }
  function computeLeaderboard() {
    return FIXED_USERS
      .map(name => ({ name, ...userRatingStats(name) }))
      .filter(u => u.count > 0)
      .sort((a, b) => b.avg - a.avg || b.count - a.count);
  }

  async function refreshAll() {
    state.loading = true;
    render();
    await loadIndex();
    state.loading = false;
    render();
  }

  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1000;
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
            else { width = Math.round(width * maxDim / height); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.68));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleUpload(files) {
    if (!state.username) return;
    const ownCount = state.index.filter(p => p.owner === state.username).length;
    const remaining = MAX_PHOTOS - ownCount;
    if (remaining <= 0) { showToast("You've reached the 20 photo limit."); return; }
    const toUpload = Array.from(files).slice(0, remaining);
    if (files.length > remaining) showToast(`Only room for ${remaining} more — uploading the first ${remaining}.`);
    let uploadedAny = false;
    for (const file of toUpload) {
      if (!file.type.startsWith('image/')) continue;
      try {
        const dataUrl = await resizeImage(file);
        const id = state.username.replace(/[^a-zA-Z0-9_-]/g, '') + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        await redisSet('photo:' + id, dataUrl);
        state.index.push({ id, owner: state.username, filename: file.name, uploadedAt: new Date().toISOString() });
        await redisSet(INDEX_KEY, JSON.stringify(state.index));
        uploadedAny = true;
      } catch (e) {
        showToast('Upload failed for ' + file.name + ': ' + e.message);
      }
    }
    render();
    if (uploadedAny) notifyUploadPush(); // one push per upload batch, not per file
  }

  function notifyUploadPush() {
    // Best-effort, fire-and-forget — never blocks or affects the upload UX.
    fetch('/api/notify-upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: state.username }),
    }).catch(() => {});
  }

  async function handleDelete(photo) {
    if (photo.owner !== state.username) return;
    if (!confirm('Remove this photo from the contest?')) return;
    try {
      state.index = state.index.filter(p => p.id !== photo.id);
      await redisSet(INDEX_KEY, JSON.stringify(state.index));
      await redisDel('photo:' + photo.id);
      redisDel('rating:' + photo.id).catch(() => {}); // best-effort cleanup, don't block on it
      delete state.ratings[photo.id];
      render();
    } catch (e) {
      showToast('Could not remove photo: ' + e.message);
    }
  }

      return photoDataCache[id];
    } catch (e) { return null; }
