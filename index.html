      ${podiumHtml()}

      <div class="close-app-row">
        <button class="close-app-btn" id="close-app-btn">✕ Close app</button>
      </div>

      <div class="section">
        <div class="section-head">
          <h2 class="section-title headline-font">My entries</h2>
          <div class="section-note">${myPhotos.length} / ${MAX_PHOTOS}</div>
        </div>
        ${openReg ? `
          <input type="file" id="file-input" accept="image/*" multiple style="display:none" />
          <button class="upload-btn" id="upload-trigger" ${myPhotos.length >= MAX_PHOTOS ? 'disabled' : ''}>
            ${myPhotos.length >= MAX_PHOTOS ? 'Limit reached' : 'Add photos'}
          </button>
          <div class="upload-hint">Up to ${MAX_PHOTOS} photos. Entries close ${fmtDate(REG_DEADLINE)}.</div>
        ` : `<div class="upload-hint">Registration is closed — no new uploads, but you can still remove your own photos.</div>`}
        ${state.loading ? `<div class="empty-state">Loading your photos…</div>` :
          myPhotos.length === 0 ? `<div class="empty-state">No entries yet. Add your first vacation shot above.</div>` :
          `<div class="photo-grid">${myPhotos.map((p, i) => photoCardHtml(p, i, true)).join('')}</div>`
        }
      </div>

      <div class="section">
        <div class="section-head">
          <h2 class="section-title headline-font">In competition</h2>
          <div class="section-note">${state.index.length} total</div>
        </div>
        ${state.loading ? `<div class="empty-state">Loading gallery…</div>` :
          otherPhotos.length === 0 ? `<div class="empty-state">No other entries yet.</div>` :
          `<div class="photo-grid">${orderedOtherPhotos(otherPhotos).map((p, i) => photoCardHtml(p, i, false)).join('')}</div>`
        }
      </div>

      <div class="app-footer">
        ${state.username ? `<button class="notif-btn" id="notif-btn" ${state.pushBusy ? 'disabled' : ''}>${pushButtonLabel()}</button>` : ''}
        <button class="admin-link" id="admin-link">Admin</button>
      </div>

      ${(!state.username || state.showSwitcher) ? userPickerHtml() : ''}
      ${state.showAdmin ? adminModalHtml() : ''}
      ${state.lightbox ? lightboxHtml() : ''}
      ${state.toastMsg ? `<div class="toast">${escapeHtml(state.toastMsg)}</div>` : ''}
    `;

    attachHandlers();
    hydrateImages();
  }

  function chatPanelHtml() {
    const msgs = state.chats[GROUP_THREAD_KEY] || [];
    return `
      <div class="chat-panel">
        <div class="chat-panel-head">
          <div class="chat-panel-title">Group chat</div>
          <button class="chat-close" id="chat-close" title="Close">✕</button>
        </div>
        <div class="chat-messages" id="chat-messages">${renderChatMessages(msgs)}</div>
        <form class="chat-compose" id="chat-compose">
          <input type="text" id="chat-input" placeholder="Message everyone…" maxlength="500" autocomplete="off" />
          <button type="submit" class="chat-send">Send</button>
        </form>
      </div>
    `;
  }

  function podiumHtml() {
    const top = computeLeaderboard().slice(0, 3);
    if (!top.length) return '';
    const rankMeta = [
      { barClass: 'podium-bar-1', medal: '🥇' },
      { barClass: 'podium-bar-2', medal: '🥈' },
      { barClass: 'podium-bar-3', medal: '🥉' },
    ];
    const entries = top.map((u, i) => ({ ...u, ...rankMeta[i] }));
    // Classic podium visual order: 2nd on the left, 1st in the middle, 3rd on the right.
    const visual = entries.length === 3 ? [entries[1], entries[0], entries[2]] : entries;
    return `
      <div class="podium-section">
        <h2 class="section-title headline-font podium-title">🏆 Top rated</h2>
        <div class="podium">
          ${visual.map(u => `
            <div class="podium-col">
              <div class="podium-name">${escapeHtml(u.name)}</div>
              <div class="podium-rating">★ ${u.avg.toFixed(1)}</div>
              <div class="podium-bar ${u.barClass}"><span class="podium-medal">${u.medal}</span></div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function photoCardHtml(photo, i, isOwn) {
    const rotate = (i % 2 === 0 ? -1.5 : 1.5) + (i % 3 === 0 ? 0.5 : 0);
    const { avg, count } = ratingStats(photo.id);
    return `
      <div class="photo-card" style="transform: rotate(${rotate}deg)" data-photo-id="${photo.id}">
        ${isOwn ? `<button class="delete-btn" data-delete-id="${photo.id}" title="Remove">✕</button>` : ''}
        <img data-img-id="${photo.id}" alt="Vacation entry" />
        <div class="photo-owner-tag">${escapeHtml(photo.owner)}</div>
        ${count ? `<div class="rating-badge">★ ${avg.toFixed(1)}</div>` : ''}
      </div>
    `;
  }

  function userPickerHtml() {
    const isSwitch = !!state.username;
    const options = FIXED_USERS.map(name => {
      const isActive = name === state.username;
      return `
        <button class="user-option${isActive ? ' user-option-active' : ''}" data-pick-user="${escapeHtml(name)}">
          <span class="user-option-name">${escapeHtml(name)}</span>
          ${isActive ? `<span class="user-option-check" title="Currently signed in">✓</span>` : ''}
        </button>
      `;
    }).join('');
    return `
      <div class="modal-overlay" id="picker-overlay">
        <div class="modal-box">
          <h2 class="headline-font">${isSwitch ? 'Switch user' : 'Who are you?'}</h2>
          <p>${isSwitch ? 'Pick which entrant this device should upload as.' : 'Choose your name to see and manage your entries.'}</p>
          <div class="user-option-list">${options}</div>
        </div>
      </div>
    `;
  }

  function adminModalHtml() {
    return `
      <div class="modal-overlay" id="admin-overlay">
        <div class="modal-box">
          <h2 class="headline-font">Admin</h2>
          ${state.adminUnlocked ? adminRosterHtml() : adminLoginHtml()}
          <button class="admin-cancel" id="admin-cancel">Close</button>
        </div>
      </div>
    `;
  }

  function adminLoginHtml() {
    return `
      <p>Enter the admin password to manage who can enter the contest.</p>
      <input type="password" id="admin-password-input" placeholder="Password" autocomplete="off" />
      ${state.adminError ? `<div class="modal-error">${escapeHtml(state.adminError)}</div>` : ''}
      <button class="primary" id="admin-unlock-btn" ${state.adminBusy ? 'disabled' : ''}>${state.adminBusy ? 'Checking…' : 'Unlock'}</button>
    `;
  }

  function adminRosterHtml() {
    const rows = FIXED_USERS.map(name => `
      <div class="admin-user-row">
        <span>${escapeHtml(name)}</span>
        <button class="admin-remove-btn" data-admin-remove="${escapeHtml(name)}" ${state.adminBusy ? 'disabled' : ''} title="Remove">✕</button>
      </div>
    `).join('');
    return `
      <p>Add or remove people who can enter the contest and use chat. This doesn't delete anything they've already uploaded or sent.</p>
      <div class="admin-user-list">${rows || '<div class="empty-state">No users yet.</div>'}</div>
      ${state.adminError ? `<div class="modal-error">${escapeHtml(state.adminError)}</div>` : ''}
      <form id="admin-add-form" class="admin-add-form">
        <input type="text" id="admin-add-input" placeholder="New name" maxlength="30" autocomplete="off" />
        <button type="submit" class="primary" style="width:auto;margin-top:0;" ${state.adminBusy ? 'disabled' : ''}>Add</button>
      </form>
      ${adminRatingsHtml()}
    `;
  }

  function adminRatingsHtml() {
    if (!state.index.length) {
      return `<h3 class="admin-subheading">Photo ratings</h3><p class="empty-state">No photos uploaded yet.</p>`;
    }
    const byOwner = {};
    state.index.forEach(photo => {
      if (!byOwner[photo.owner]) byOwner[photo.owner] = [];
      byOwner[photo.owner].push(photo);
    });
    const ownerNames = Object.keys(byOwner).sort((a, b) => a.localeCompare(b));

    const groups = ownerNames.map(owner => {
      const uStats = userRatingStats(owner);
      const photosHtml = byOwner[owner].map(photo => {
        const map = state.ratings[photo.id] || {};
        const entries = Object.entries(map);
        const detail = entries.length
          ? entries.map(([user, stars]) => `${escapeHtml(user)}: ${'★'.repeat(stars)}${'☆'.repeat(5 - stars)}`).join('<br>')
          : '<em>No ratings yet</em>';
        return `
          <div class="admin-rating-photo-row">
            <img class="admin-rating-thumb" data-img-id="${photo.id}" alt="" />
            <div class="admin-rating-detail">${detail}</div>
          </div>
        `;
      }).join('');
      return `
        <div class="admin-owner-group">
          <div class="admin-owner-header">
            <span class="admin-owner-name">${escapeHtml(owner)}</span>
            <span class="admin-owner-avg">${uStats.count ? `★ ${uStats.avg.toFixed(1)} avg` : 'No ratings yet'}</span>
          </div>
          <div class="admin-owner-photos">${photosHtml}</div>
        </div>
      `;
    }).join('');

    return `
      <h3 class="admin-subheading">Photo ratings</h3>
      <div class="admin-ratings-list">${groups}</div>
    `;
  }

  function lightboxHtml() {
    const p = state.lightbox;
    const canNav = state.index.length > 1;
    return `
      <div class="lightbox" id="lightbox-overlay">
        <div class="lightbox-frame">
          <div class="lightbox-topbar">
            <button class="lightbox-close" id="lightbox-close">✕ Close</button>
          </div>
          <div class="lightbox-image-row">
            ${canNav ? `<button class="lightbox-nav lightbox-prev" id="lightbox-prev" title="Previous photo">‹</button>` : ''}
            <img id="lightbox-img" alt="Vacation entry" />
            ${canNav ? `<button class="lightbox-nav lightbox-next" id="lightbox-next" title="Next photo">›</button>` : ''}
          </div>
          <div class="lightbox-bottom">
            <div class="lightbox-caption">${escapeHtml(p.owner)}</div>
            ${state.username ? interactiveStarsHtml(p.id) : ''}
          </div>
        </div>
      </div>
    `;
  }

  function navigateLightbox(delta) {
    if (!state.lightbox || !state.index.length) return;
    const idx = state.index.findIndex(p => p.id === state.lightbox.id);
    if (idx === -1) return;
    const nextIdx = (idx + delta + state.index.length) % state.index.length;
    state.lightbox = state.index[nextIdx];
    render();
    refreshRatingForPhoto(state.lightbox.id);
  }

  function interactiveStarsHtml(photoId) {
    const { avg, count } = ratingStats(photoId);
    const photo = state.index.find(p => p.id === photoId);
    const isOwnPhoto = photo && photo.owner === state.username;
    const summary = count ? `${avg.toFixed(1)} average · ${count} rating${count > 1 ? 's' : ''}` : 'No ratings yet' + (isOwnPhoto ? '' : ' — be the first');

    if (isOwnPhoto) {
      return `
        <div class="rate-widget">
          <div class="rate-summary">${summary}</div>
          <div class="rate-own-note">You can't rate your own photo</div>
        </div>
      `;
    }

    const mine = myRating(photoId);
    // Markup goes 5→1 (highest first) with the container flex-reversed back to
    // a normal 1→5 visual order — that's what lets ":hover ~" cascade the
    // highlight down to every LOWER star using plain CSS, giving a live
    // "slider" preview before the click confirms the rating.
    const stars = [5, 4, 3, 2, 1].map(i => `
      <button class="star-btn ${i <= mine ? 'star-filled' : ''}" data-rate-photo="${escapeHtml(photoId)}" data-star-value="${i}" title="Rate ${i} star${i > 1 ? 's' : ''}">★</button>
    `).join('');
    return `
      <div class="rate-widget">
        <div class="rate-stars">${stars}</div>
        <div class="rate-summary">${summary}</div>
      </div>
    `;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  async function hydrateImages() {
    const imgs = root.querySelectorAll('img[data-img-id]');
    imgs.forEach(async (imgEl) => {
      const id = imgEl.getAttribute('data-img-id');
      const data = await getPhotoData(id);
      if (data) imgEl.src = data;
    });
    const lb = document.getElementById('lightbox-img');
    if (lb && state.lightbox) {
      const data = await getPhotoData(state.lightbox.id);
      if (data) lb.src = data;
    }
  }

  function attachHandlers() {
    const switchBtn = document.getElementById('switch-user-btn');
    if (switchBtn) switchBtn.onclick = () => {
      state.showSwitcher = true;
      render();
      loadUsersList().then(render); // pick up any admin changes since load
    };

    root.querySelectorAll('[data-pick-user]').forEach(btn => {
      btn.onclick = () => saveUsername(btn.getAttribute('data-pick-user'));
    });

    const pickerOverlay = document.getElementById('picker-overlay');
    if (pickerOverlay && state.username) {
      // only allow dismissing by clicking outside once a user is already chosen —
      // the very first pick is required.
      pickerOverlay.onclick = (e) => {
        if (e.target === pickerOverlay) { state.showSwitcher = false; render(); }
      };
    }

    const notifBtn = document.getElementById('notif-btn');
    if (notifBtn) {
      notifBtn.onclick = () => {
        if (state.pushStatus === 'enabled') { showToast('Notifications are already on for this device.'); return; }
        if (state.pushStatus === 'denied') { showToast('Notifications are blocked in your browser settings for this site — re-enable them there first.'); return; }
        enableNotifications();
      };
    }

    const closeAppBtn = document.getElementById('close-app-btn');
    if (closeAppBtn) closeAppBtn.onclick = () => closeApp();

    const adminLink = document.getElementById('admin-link');
    if (adminLink) {
      adminLink.onclick = () => {
        state.showAdmin = true;
        state.adminError = null;
        render();
        if (state.adminUnlocked) loadRatingsFor(state.index.map(p => p.id)).then(render);
      };
    }
    const adminCancel = document.getElementById('admin-cancel');
    if (adminCancel) adminCancel.onclick = () => { state.showAdmin = false; state.adminError = null; render(); };
    const adminOverlay = document.getElementById('admin-overlay');
    if (adminOverlay) {
      adminOverlay.onclick = (e) => {
        if (e.target === adminOverlay) { state.showAdmin = false; state.adminError = null; render(); }
      };
    }

    const adminUnlockBtn = document.getElementById('admin-unlock-btn');
    if (adminUnlockBtn) {
      const doUnlock = async () => {
        const input = document.getElementById('admin-password-input');
        const pwd = input.value;
        if (!pwd) return;
        state.adminBusy = true;
        state.adminError = null;
        render();
        try {
          await adminCall({ action: 'verify', password: pwd });
          state.adminUnlocked = true;
          state.adminPasswordCache = pwd;
          await loadUsersList();
          await loadRatingsFor(state.index.map(p => p.id));
        } catch (e) {
          state.adminError = e.message;
        }
        state.adminBusy = false;
        render();
      };
      adminUnlockBtn.onclick = doUnlock;
      const pwInput = document.getElementById('admin-password-input');
      if (pwInput) {
        pwInput.focus();
        pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doUnlock(); });
      }
    }

    const adminAddForm = document.getElementById('admin-add-form');
    if (adminAddForm) {
      adminAddForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('admin-add-input');
        const name = input.value.trim();
        if (!name) return;
        state.adminBusy = true;
        state.adminError = null;
        render();
        try {
          const data = await adminCall({ action: 'add', password: state.adminPasswordCache, username: name });
          FIXED_USERS = data.users;
        } catch (e2) {
          state.adminError = e2.message;
        }
        state.adminBusy = false;
        render();
      });
    }

    root.querySelectorAll('[data-admin-remove]').forEach(btn => {
      btn.onclick = async () => {
        const name = btn.getAttribute('data-admin-remove');
        if (!confirm(`Remove ${name}? Their existing photos and messages stay, but they won't be able to sign in as themselves anymore.`)) return;
        state.adminBusy = true;
        state.adminError = null;
        render();
        try {
          const data = await adminCall({ action: 'remove', password: state.adminPasswordCache, username: name });
          FIXED_USERS = data.users;
          if (state.username === name) {
            // the signed-in user on this device was just removed — sign them out
            state.username = null;
            try { localStorage.removeItem(LS_NAME_KEY); } catch (e3) {}
          }
        } catch (e2) {
          state.adminError = e2.message;
        }
        state.adminBusy = false;
        render();
      };
    });

    const uploadTrigger = document.getElementById('upload-trigger');
    const fileInput = document.getElementById('file-input');
    if (uploadTrigger && fileInput) {
      uploadTrigger.onclick = () => fileInput.click();
      fileInput.onchange = (e) => { if (e.target.files.length) handleUpload(e.target.files); };
    }

    const chatFab = document.getElementById('chat-fab');
    if (chatFab) {
      chatFab.onclick = () => {
        state.chatOpen = !state.chatOpen;
        render();
        if (state.chatOpen) {
          scrollChatToBottom();
          focusChatInput();
          pollChatOnce().then(scrollChatToBottom);
        }
      };
    }

    const chatClose = document.getElementById('chat-close');
    if (chatClose) chatClose.onclick = () => { state.chatOpen = false; render(); };

    const chatForm = document.getElementById('chat-compose');
    if (chatForm) {
      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        sendChatMessage(text);
      });
    }

    const inlineForm = document.getElementById('inline-compose');
    if (inlineForm) {
      inlineForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('inline-chat-input');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        sendChatMessage(text);
      });
    }

    root.querySelectorAll('[data-delete-id]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-delete-id');
        const photo = state.index.find(p => p.id === id);
        if (photo) handleDelete(photo);
      };
    });

    root.querySelectorAll('.photo-card').forEach(card => {
      card.onclick = () => {
        const id = card.getAttribute('data-photo-id');
        const photo = state.index.find(p => p.id === id);
        if (photo) {
          state.lightbox = photo;
          render();
          refreshRatingForPhoto(id); // pick up any ratings from others since page load
        }
      };
    });

    const lbClose = document.getElementById('lightbox-close');
    const lbOverlay = document.getElementById('lightbox-overlay');
    if (lbClose) lbClose.onclick = () => { state.lightbox = null; render(); };
    if (lbOverlay) lbOverlay.onclick = (e) => { if (e.target === lbOverlay) { state.lightbox = null; render(); } };

    const lbPrev = document.getElementById('lightbox-prev');
    const lbNext = document.getElementById('lightbox-next');
    if (lbPrev) lbPrev.onclick = (e) => { e.stopPropagation(); navigateLightbox(-1); };
    if (lbNext) lbNext.onclick = (e) => { e.stopPropagation(); navigateLightbox(1); };

    root.querySelectorAll('[data-star-value]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const photoId = btn.getAttribute('data-rate-photo');
        const stars = Number(btn.getAttribute('data-star-value'));
        submitRating(photoId, stars);
      };
    });
  }

  function initSplash() {
    const mount = document.getElementById('splash-art-mount');
    const splash = document.getElementById('splash-screen');
    if (!mount || !splash) return;
    const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    mount.innerHTML = beachArtSvg(!reducedMotion);
    const holdMs = reducedMotion ? 900 : 4000;
    setTimeout(() => {
      splash.classList.add('splash-hide');
      setTimeout(() => { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 650);
    }, holdMs);
  }

  (async function init() {
    initSplash();
    await loadUsersList();
    shuffleGalleryUserOrder();
    loadUsername();
    if (state.username) { loadLastSeen(); startChatPolling(); startPresenceLoop(); }
    detectPushStatus();
    render();
    await refreshAll();
    await registerServiceWorker();
    await refreshPushSubscriptionStatus();
    updatePushDOM();
  })();
})();
</script>
</body>
</html>
